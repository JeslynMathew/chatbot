<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DarGlobal & Wasalt Chatbot</title>
<style>
body{font-family:system-ui,sans-serif;max-width:720px;margin:0 auto;padding:16px;background:#f6f6f4;color:#222}
h1{font-size:20px}#log{height:60vh;overflow:auto;background:#fff;border:1px solid #ddd;border-radius:10px;padding:12px}
.m{margin:8px 0;padding:8px 12px;border-radius:10px;white-space:pre-wrap;max-width:85%}
.u{background:#222;color:#fff;margin-left:auto}.b{background:#eee}.s{font-size:12px;color:#666;margin-top:4px}
#f{display:flex;gap:8px;margin-top:10px}input{flex:1;padding:10px;border-radius:8px;border:1px solid #ccc}
button{padding:10px 16px;border:0;border-radius:8px;background:#222;color:#fff;cursor:pointer}
</style></head><body>
<h1>DarGlobal & Wasalt Assistant</h1>
<div id="log"><div class="m b">Hi! Ask me about Dar Global projects or Wasalt's real-estate platform.</div></div>
<div id="f"><input id="q" placeholder="e.g. What projects does Dar Global have in Dubai?"><button onclick="send()">Send</button></div>
<script>
let history=[];const log=document.getElementById('log'),q=document.getElementById('q');
q.addEventListener('keydown',e=>{if(e.key==='Enter')send()});
function add(t,c,src){const d=document.createElement('div');d.className='m '+c;d.textContent=t;
 if(src&&src.length){const s=document.createElement('div');s.className='s';s.textContent='Sources: '+src.join(', ');d.appendChild(s)}
 log.appendChild(d);log.scrollTop=log.scrollHeight;return d}
async function send(){const m=q.value.trim();if(!m)return;q.value='';add(m,'u');const w=add('Thinking…','b');
 try{const r=await fetch('/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:m,history})});
 const j=await r.json();w.remove();add(j.answer,'b',j.sources);history.push({role:'user',content:m},{role:'assistant',content:j.answer})}
 catch(e){w.textContent='Error: '+e}}
</script></body></html>
